name: Build EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name NetworkMonitor network_monitor.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: NetworkMonitor
          path: dist/NetworkMonitor.exe
